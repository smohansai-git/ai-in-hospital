<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | AI IN HOSPITAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body class="auth-body">
    <div class="auth-card wide-card">
      <div class="auth-header">
        <div class="brand-icon large"><i class="fa-solid fa-user-plus"></i></div>
        <h1>Create Account</h1>
        <p>Join the hospital operations platform</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-stack auth-flash">
            {% for category, message in messages %}
              <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form method="post" class="auth-form two-column">
        <div class="form-group">
          <label for="full_name">Full Name</label>
          <input type="text" id="full_name" name="full_name" required placeholder="Enter full name" />
        </div>

        <div class="form-group">
          <label for="user_id">User ID</label>
          <input type="text" id="user_id" name="user_id" required placeholder="Unique user ID" />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="name@example.com" />
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" required placeholder="+123 456 789" />
        </div>

        <div class="form-group">
          <label for="role">Role</label>
          <select id="role" name="role" required>
            <option value="">Choose role</option>
            <option>Administrator</option>
            <option>Doctor</option>
            <option>Nurse</option>
            <option>Receptionist</option>
          </select>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" required placeholder="Create a secure password" />
            <button type="button" class="toggle-password" data-target="password"><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>

        <div class="form-group full-row">
          <label for="confirm_password">Confirm Password</label>
          <div class="password-wrap">
            <input type="password" id="confirm_password" name="confirm_password" required placeholder="Re-enter password" />
            <button type="button" class="toggle-password" data-target="confirm_password"><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>

        <div class="full-row auth-actions">
          <button type="submit" class="primary-btn">Register</button>
          <a class="secondary-link" href="{{ url_for('login') }}">Back to login</a>
        </div>
      </form>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
